<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Video Streams</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="video-container">
        <div class="video-wrapper" id="video-wrapper-1">
            <div class="header">
                <span class="source-name"></span>
                <div class="status">
                    <span class="status-indicator"></span>
                    <span class="status-text"></span>
                </div>
                <button class="zoom-btn" data-target="1">Zoom</button>
            </div>
            <video id="video-1" muted autoplay></video>
            <div class="osd"></div>
            <div class="video-path"></div>
        </div>
        <div class="video-wrapper" id="video-wrapper-2">
            <div class="header">
                <span class="source-name"></span>
                <div class="status">
                    <span class="status-indicator"></span>
                    <span class="status-text"></span>
                </div>
                <button class="zoom-btn" data-target="2">Zoom</button>
            </div>
            <video id="video-2" muted autoplay></video>
            <div class="osd"></div>
            <div class="video-path"></div>
        </div>
        <div class="video-wrapper" id="video-wrapper-3">
            <div class="header">
                <span class="source-name"></span>
                <div class="status">
                    <span class="status-indicator"></span>
                    <span class="status-text"></span>
                </div>
                <button class="zoom-btn" data-target="3">Zoom</button>
            </div>
            <video id="video-3" muted autoplay></video>
            <div class="osd"></div>
            <div class="video-path"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="script.js"></script>
</body>
</html>
